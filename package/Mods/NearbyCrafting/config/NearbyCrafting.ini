# NearbyCrafting packaged settings
#
# While Icarus is running, save this file and press ReloadConfigKey to reload:
# ScanRadiusMeters, MaxNearbyInventories, IncludeBenchInventories,
# CraftingExcludedContainers,
# BenchCacheRefreshMilliseconds, PlayerCacheRefreshMilliseconds,
# DepositIncludeBenchInventories, DepositExcludedItems, DepositExcludedContainers,
# ExcludeClientOnlyInventories, and ExcludeRemoveOnlyInventories.
# Enabled, ReloadConfigKey, RepairsEnabled, DepositEnabled, DepositModifier, and
# DepositKey require an Icarus restart.

[General]

# Turn NearbyCrafting on or off. Changing this setting requires an Icarus restart.
Enabled = true

# Reload the live-safe settings listed above after saving this file. Set this to NONE
# or leave it empty to disable live configuration reload. Changing this setting itself
# requires an Icarus restart.
ReloadConfigKey = F5

# How far crafting, inventory repairs, and nearby deposit can reach, measured in metres
# from the player or crafting station.
ScanRadiusMeters = 20.0

# Maximum number of nearby inventories to check for crafting or deposit.
# Storage containers are used first, nearest to farthest. Crafting-station inventories
# are used afterward, also nearest to farthest.
MaxNearbyInventories = 96

# Allow items inside nearby crafting stations to be used after storage containers.
IncludeBenchInventories = true

# Comma-separated container Blueprint class names that nearby crafting and repairs must skip.
# Matching is case-insensitive. Include the generated _C suffix. Search UE4SS.log for
# "Deposit container identifier" to find names that can be copied here.
# Identifiers generally look like BP_Bench_Name_C.
CraftingExcludedContainers =

# Allow inventory repairs to use materials from nearby inventories. Disable this if a
# future Icarus version has compatibility problems with the optional native repair hook.
# Changing this setting requires an Icarus restart.
RepairsEnabled = true

# Backup refresh interval for stationary crafting stations, in milliseconds.
# Nearby storage or station placement changes are normally detected immediately.
# The default value is recommended.
BenchCacheRefreshMilliseconds = 30000

# Refresh interval while crafting from your moving character, in milliseconds.
# Lower values update the nearby area more often. The default value is recommended.
PlayerCacheRefreshMilliseconds = 1000

# Protect special temporary inventories used only by the game interface.
# Leave this enabled unless troubleshooting a compatibility problem.
ExcludeClientOnlyInventories = true

# Protect special inventories that are meant only for taking items out.
# Leave this enabled unless troubleshooting a compatibility problem.
ExcludeRemoveOnlyInventories = true

[Deposit]

# Enable the shortcut that deposits backpack items into nearby inventories.
# Hotbar items are never included. Each item is only sent to an inventory that already
# contains that item type. Changing this setting requires an Icarus restart.
DepositEnabled = true

# Use NONE, SHIFT, CTRL, ALT, or a combination such as CTRL+SHIFT.
# The configured modifiers must match exactly when DepositKey is pressed.
# Changing this setting requires an Icarus restart.
DepositModifier = SHIFT

# Key names use UE4SS names such as O, F8, HOME, PAGE_UP, or NUM_ZERO.
# Changing this setting requires an Icarus restart.
DepositKey = E

# Allow matching backpack items to be deposited into crafting-station inventories.
# This is independent from IncludeBenchInventories above. Set this to false to deposit
# only into storage chests and containers.
DepositIncludeBenchInventories = true

# Comma-separated in-game item names that Quick Deposit must leave in the backpack.
# Names are matched in full (case-insensitively) against the current in-game language.
# For example: Composite Arrow, 12-Gauge Slug
# Leave this empty to use Icarus's original TransferLike action for every destination.
DepositExcludedItems =

# Comma-separated container Blueprint class names that Quick Deposit must skip.
# Matching is case-insensitive. Include the generated _C suffix. Search UE4SS.log for
# "Deposit container identifier" to find names that can be copied here.
# Identifiers generally look like BP_Bench_Name_C.
DepositExcludedContainers = BP_Deep_Freeze_C, BP_Refrigerator_C, BP_IceBox_C
